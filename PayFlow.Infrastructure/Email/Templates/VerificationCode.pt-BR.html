<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Verificação de e-mail</title>
</head>

<body style="
    margin: 0;
    padding: 0;
    background-color: #f4f4f4;
    font-family: Arial, Helvetica, sans-serif;
">

    <table width="100%" cellpadding="0" cellspacing="0">
        <tr>
            <td align="center">

                <table width="600"
                       cellpadding="0"
                       cellspacing="0"
                       style="
                        max-width: 600px;
                        background: #ffffff;
                        padding: 40px;
                    ">

                    <tr>
                        <td>

                            <h1>Olá, {{name}}!</h1>

                            <p>
                                Recebemos uma solicitação para criar
                                sua conta no PayFlow.
                            </p>

                            <p>
                                Seu código de verificação é:
                            </p>

                            <div style="
                                text-align: center;
                                margin: 30px 0;
                            ">
                                <span style="
                                    font-size: 32px;
                                    font-weight: bold;
                                    letter-spacing: 8px;
                                ">
                                    {{code}}
                                </span>
                            </div>

                            <p>
                                Este código é válido por
                                <strong>10 minutos</strong>.
                            </p>

                            <p>
                                Se você não solicitou esta conta,
                                ignore este e-mail.
                            </p>

                        </td>
                    </tr>

                </table>

            </td>
        </tr>
    </table>

</body>
</html>
