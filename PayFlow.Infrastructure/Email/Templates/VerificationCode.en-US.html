<!DOCTYPE html>
<html lang="en-US">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Email verification</title>
</head>

<body style="
    margin: 0;
    padding: 0;
    background-color: #f4f4f4;
    font-family: Arial, Helvetica, sans-serif;
">

    <table width="100%"
           cellpadding="0"
           cellspacing="0"
           style="padding: 40px 0;">
        <tr>
            <td align="center">

                <table width="600"
                       cellpadding="0"
                       cellspacing="0"
                       style="
                        max-width: 600px;
                        background-color: #ffffff;
                        border-radius: 8px;
                        padding: 40px;
                    ">
                    <tr>
                        <td>

                            <h1 style="
                                margin-top: 0;
                                color: #222222;
                            ">
                                Hello, {{name}}!
                            </h1>

                            <p style="
                                color: #555555;
                                font-size: 16px;
                                line-height: 1.6;
                            ">
                                We received a request to create
                                your PayFlow account.
                            </p>

                            <p style="
                                color: #555555;
                                font-size: 16px;
                                line-height: 1.6;
                            ">
                                Use the code below to verify
                                your email address:
                            </p>

                            <div style="
                                margin: 30px 0;
                                text-align: center;
                            ">
                                <span style="
                                    display: inline-block;
                                    padding: 16px 30px;
                                    background-color: #f1f1f1;
                                    border-radius: 8px;
                                    font-size: 32px;
                                    font-weight: bold;
                                    letter-spacing: 8px;
                                    color: #222222;
                                ">
                                    {{code}}
                                </span>
                            </div>

                            <p style="
                                color: #777777;
                                font-size: 14px;
                                line-height: 1.6;
                            ">
                                This code is valid for
                                <strong>10 minutes</strong>.
                            </p>

                            <p style="
                                color: #777777;
                                font-size: 14px;
                                line-height: 1.6;
                            ">
                                If you did not request this account,
                                please ignore this email.
                            </p>

                            <hr style="
                                border: none;
                                border-top: 1px solid #eeeeee;
                                margin: 30px 0;
                            ">

                            <p style="
                                color: #999999;
                                font-size: 12px;
                            ">
                                This is an automated email.
                                Please do not reply.
                            </p>

                        </td>
                    </tr>
                </table>

            </td>
        </tr>
    </table>

</body>
</html>
