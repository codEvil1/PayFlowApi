name: Build and Deploy to Azure Container
on:
  push:
    branches: [main]
concurrency:
  group: deploy-production
  cancel-in-progress: false
env:
  REGISTRY: ghcr.io
jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set lowercase image name
        id: image
        run: echo "name=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT
      - name: Set image tag
        id: meta
        run: echo "tag=${{ env.REGISTRY }}/${{ steps.image.outputs.name }}:${{ github.sha }}" >> $GITHUB_OUTPUT
      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ steps.meta.outputs.tag }}
            ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}:latest

  migrate:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Install dotnet-ef
        run: dotnet tool install --global dotnet-ef
      - name: Restore dependencies
        run: dotnet restore PayFlow.Api/PayFlow.Api.csproj
      - name: Apply database migrations
        run: |
          export PATH="$PATH:$HOME/.dotnet/tools"
          dotnet ef database update \
            --project PayFlow.Infrastructure \
            --startup-project PayFlow.Api \
            --connection "${{ secrets.DB_CONNECTION_STRING }}"

  deploy:
    needs: [build-and-push, migrate]
    runs-on: ubuntu-latest
    steps:
      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Install containerapp extension
        run: az extension add --name containerapp --upgrade --only-show-errors

      - name: Ensure Container App exists
        run: |
          if ! az containerapp show --name payflow-api --resource-group payflow-rg -o none 2>/dev/null; then
            echo "Container App não existe. Criando..."
            az containerapp create \
              --name payflow-api \
              --resource-group payflow-rg \
              --environment payflow-env \
              --image ${{ needs.build-and-push.outputs.image_tag }} \
              --target-port 8080 \
              --ingress external \
              --registry-server ${{ env.REGISTRY }} \
              --registry-username ${{ github.actor }} \
              --registry-password ${{ secrets.GITHUB_TOKEN }}
          else
            echo "Container App já existe. Prosseguindo."
          fi

      - name: Wait for provisioning to complete
        run: |
          for i in {1..30}; do
            STATE=$(az containerapp show --name payflow-api --resource-group payflow-rg --query "properties.provisioningState" -o tsv 2>/dev/null || echo "NotFound")
            echo "Provisioning state: $STATE"
            if [ "$STATE" == "Succeeded" ] || [ "$STATE" == "NotFound" ]; then
              break
            fi
            sleep 10
          done

      - name: Set Container App secrets
        run: |
          az containerapp secret set \
            --name payflow-api \
            --resource-group payflow-rg \
            --secrets \
              db-connection="${{ secrets.DB_CONNECTION_STRING }}" \
              jwt-secret="${{ secrets.JWT_SECRET }}" \
              cf-account-id="${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" \
              cf-access-key="${{ secrets.CLOUDFLARE_ACCESS_KEY }}" \
              cf-secret-key="${{ secrets.CLOUDFLARE_SECRET_KEY }}" \
              cf-bucket-name="${{ secrets.CLOUDFLARE_BUCKET_NAME }}" \
              cf-public-url="${{ secrets.CLOUDFLARE_PUBLIC_URL }}"

      - name: Deploy to Azure Container Apps
        uses: azure/container-apps-deploy-action@v2
        with:
          resourceGroup: payflow-rg
          containerAppName: payflow-api
          containerAppEnvironment: payflow-env
          imageToDeploy: ${{ needs.build-and-push.outputs.image_tag }}
          environmentVariables: >
            ASPNETCORE_ENVIRONMENT=Production
            ConnectionStrings__AppDbConnectionString=secretref:db-connection
            Jwt__Secret=secretref:jwt-secret
            Jwt__Issuer=PayFlow
            Jwt__Audience=PayFlow
            Jwt__ExpirationMinutes=60
            CloudflareR2__AccountId=secretref:cf-account-id
            CloudflareR2__AccessKey=secretref:cf-access-key
            CloudflareR2__SecretKey=secretref:cf-secret-key
            CloudflareR2__BucketName=secretref:cf-bucket-name
            CloudflareR2__PublicUrl=secretref:cf-public-url
          targetPort: 8080
          ingress: external
