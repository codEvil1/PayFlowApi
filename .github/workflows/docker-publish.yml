name: Docker Image CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main


jobs:

  build:

    runs-on: ubuntu-latest


    steps:

    - name: Checkout
      uses: actions/checkout@v5


    - name: Build Docker image
      run: |
        docker build \
          --file Dockerfile \
          --tag payflow-api:${{ github.sha }} \
          .
