name: CodeQL
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"
jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4.37.9
        with:
          languages: csharp
      - uses: github/codeql-action/autobuild@v4.37.9
      - uses: github/codeql-action/analyze@v4.37.9
