name: Docker Image CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:


jobs:

  build:

    name: Build Docker Image
    runs-on: ubuntu-latest


    steps:

    - name: Checkout repository
      uses: actions/checkout@v5


    - name: Build Docker image
      run: |
        docker build \
          --file Dockerfile \
          --tag payflow-api:${{ github.sha }} \
          .
